[package]
name = "mangouste"
version = "0.1.6"
description = "Single-window multi-repo Claude Code workbench"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "mangouste_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
parking_lot = "0.12"
portable-pty = "0.9"
notify = "8"
notify-debouncer-full = "0.6"
arboard = "3"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
ignore = "0.4"
dirs = "6"
libc = "0.2"
ureq = { version = "2", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
