name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref; a full matrix build is slow and there
# is no value in finishing one that a newer push has already replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            # 24.04 for libgtk-3-0t64: the .deb's Depends names it, and the
            # runner has to be able to resolve what it produces.
            bundles: deb,appimage
            rust-targets: x86_64-unknown-linux-gnu
            bundle-target: x86_64-unknown-linux-gnu
            test-target: x86_64-unknown-linux-gnu

          - os: ubuntu-24.04-arm
            # Free arm64 Linux runner (public repos only). Native build, so no
            # cross toolchain and the tests actually execute on-target.
            bundles: deb,appimage
            rust-targets: aarch64-unknown-linux-gnu
            bundle-target: aarch64-unknown-linux-gnu
            test-target: aarch64-unknown-linux-gnu

          - os: macos-14
            # One universal dmg instead of two: macos-14 is Apple Silicon, and
            # its Xcode carries both SDK slices, so the x86_64 half is a plain
            # cross-compile. `universal-apple-darwin` is a Tauri pseudo-target
            # and not a rustc one, hence the separate test-target below --
            # tests run native aarch64 rather than under Rosetta.
            bundles: dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle-target: universal-apple-darwin
            test-target: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.bundle-target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - run: npm ci

      # Typecheck and both test suites before bundling: a bundle failure is slow
      # to reach and tells you far less than a failing test does.
      - run: npm run build

      - name: vitest
        run: npm test

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --target ${{ matrix.test-target }}

      - name: Bundle
        run: npx tauri build --target ${{ matrix.bundle-target }} --bundles ${{ matrix.bundles }}

      # An arm64 binary with no valid signature is killed on launch, not merely
      # warned about, so an unsigned bundle is not a lesser product -- it is one
      # that cannot start. `signingIdentity: "-"` in tauri.conf.json asks the
      # bundler for an ad-hoc signature; this asserts it actually applied one,
      # since the failure would otherwise only show up on a user's Mac.
      #
      # Checked inside the mounted .dmg rather than in bundle/macos, because the
      # dmg bundler deletes the .app once it has been copied into the image --
      # and the copy in the image is the one people actually run. `lipo` goes
      # with it: a universal bundle missing a slice is the other way this
      # artifact can be broken without the build saying so.
      - name: Verify the macOS bundle is signed and universal
        if: runner.os == 'macOS'
        run: |
          dmg="$(find src-tauri/target/${{ matrix.bundle-target }}/release/bundle/dmg \
                 -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg" || { echo "no .dmg was bundled"; exit 1; }
          mount="$(mktemp -d)"
          # Detach even when a check below fails, so a failed run does not leave
          # the image attached to the runner.
          trap 'hdiutil detach "$mount" -quiet || true' EXIT
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly -quiet
          app="$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$app" || { echo "no .app inside $dmg"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app"
          # Assert src-tauri/Info.plist was merged rather than ignored. These
          # strings are what the system quotes when it asks for access to a
          # repository under ~/Documents; without them the prompt is a bare
          # demand, which is one people deny. `-extract raw` exits non-zero when
          # the key is absent, so no parsing is involved.
          for key in NSDocumentsFolderUsageDescription \
                     NSDesktopFolderUsageDescription \
                     NSDownloadsFolderUsageDescription; do
            plutil -extract "$key" raw "$app/Contents/Info.plist" >/dev/null \
              || { echo "Info.plist was not merged: $key is missing"; exit 1; }
          done
          bin="$(find "$app/Contents/MacOS" -maxdepth 1 -type f -perm -u+x -print -quit)"
          archs="$(lipo -archs "$bin")"
          echo "$bin: $archs"
          case "$archs" in
            *arm64*x86_64* | *x86_64*arm64*) ;;
            *) echo "not a universal binary"; exit 1 ;;
          esac

      # Tauri hardcodes the pre-t64 `libgtk-3-0` into Depends, which has no
      # candidate on 24.04, so the generated .deb will not install until the
      # field is rewritten. See scripts/fix-deb-depends.sh.
      - name: Repair .deb Depends
        if: runner.os == 'Linux'
        run: |
          for deb in src-tauri/target/${{ matrix.bundle-target }}/release/bundle/deb/*.deb; do
            ./scripts/fix-deb-depends.sh "$deb"
          done

      # Globbed rather than named: the artifact filenames carry productName and
      # version, so this keeps working across a rename or a version bump. Both
      # platforms' patterns are listed together -- the ones that match nothing
      # on a given runner are simply skipped, and if-no-files-found only trips
      # when the whole list comes up empty.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bundle-target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.bundle-target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.bundle-target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.bundle-target }}/release/bundle/dmg/*.dmg

  release:
    # Tags only. Draft, so the unsigned-macOS caveat can be written into the
    # notes before anyone can download it.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: artifacts/**/*
